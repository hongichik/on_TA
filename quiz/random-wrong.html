<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn câu hay sai</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="quiz-title">Ôn câu hay sai</h1>
    <a class="back" href="index.html">&larr; Trang chủ</a>
  </header>

  <div class="card" id="setup-card">
    <p class="note-box hidden" id="not-configured">
      Trang này cần kết nối Google Sheet để biết bạn hay sai câu nào.
      Hãy vào <a href="settings.html">trang Cài đặt</a> để kết nối trước.
    </p>
    <p class="pool-info" id="pool-info">Đang tải dữ liệu...</p>
    <div class="setup-row" id="setup-row">
      <label for="count-input">Số câu muốn ôn:</label>
      <input type="number" id="count-input" min="1" value="20">
      <button class="btn-primary" id="start-btn">Bắt đầu</button>
    </div>
  </div>

  <div class="card hidden" id="quiz-card">
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <div class="progress-info" id="progress-info"></div>
    <p class="q-text" id="q-text"></p>
    <div class="options" id="options"></div>
    <div class="explain" id="explain"></div>
    <div class="nav-row">
      <button class="btn-secondary" id="prev-btn">&larr; Câu trước</button>
      <button class="btn-secondary" id="next-btn">Câu sau &rarr;</button>
    </div>
  </div>

  <div class="card hidden" id="nav-card">
    <div class="grid" id="nav-grid"></div>
    <div class="nav-row" style="margin-top:16px;">
      <span></span>
      <button class="btn-primary" id="finish-btn">Nộp bài / Xem kết quả</button>
    </div>
  </div>

  <div class="card summary hidden" id="summary-card">
    <h2>Kết quả</h2>
    <div id="score-text"></div>
    <div class="summary-actions">
      <button class="btn-secondary" id="review-btn">Xem lại bài làm</button>
      <button class="btn-primary" id="restart-btn">Làm lại (xáo trộn lại)</button>
    </div>
  </div>
</div>

<script src="sheet-client.js"></script>
<script src="quiz-engine.js"></script>
<script src="random-wrong.js"></script>
</body>
</html>
