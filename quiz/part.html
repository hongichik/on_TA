<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trắc nghiệm theo phần</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="quiz-title">Luyện tập trắc nghiệm</h1>
    <a class="back" href="index.html">&larr; Trang chủ</a>
  </header>

  <div class="card hidden" id="empty-state">
    <p style="margin:0;" id="empty-msg">Không tải được câu hỏi từ Google Sheet cho phần này. Vào <a href="settings.html">trang Cài đặt</a> để kiểm tra kết nối.</p>
  </div>

  <div class="card" id="quiz-card">
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <div class="progress-info" id="progress-info"></div>
    <p class="q-text" id="q-text"></p>
    <div class="options" id="options"></div>
    <div class="explain" id="explain"></div>
    <div class="nav-row">
      <button class="btn-secondary" id="prev-btn">&larr; Câu trước</button>
      <button class="btn-secondary" id="next-btn">Câu sau &rarr;</button>
    </div>
  </div>

  <div class="card" id="nav-card">
    <div class="grid" id="nav-grid"></div>
    <div class="nav-row" style="margin-top:16px;">
      <span></span>
      <button class="btn-primary" id="finish-btn">Nộp bài / Xem kết quả</button>
    </div>
  </div>

  <div class="card summary hidden" id="summary-card">
    <h2>Kết quả</h2>
    <div id="score-text"></div>
    <div class="summary-actions">
      <button class="btn-secondary" id="review-btn">Xem lại bài làm</button>
      <button class="btn-primary" id="restart-btn">Làm lại (xáo trộn lại)</button>
    </div>
  </div>
</div>

<script src="sheet-client.js"></script>
<script src="quiz-engine.js"></script>
<script>
(async function () {
  const CHUNK = 20;
  const params = new URLSearchParams(location.search);
  const n = Math.max(1, parseInt(params.get('n'), 10) || 1);

  let data = [];
  let title = `Phần ${n}`;

  if (window.SheetClient.isConfigured()) {
    try {
      const all = (await window.SheetClient.fetchQuestions()) || [];
      const start = (n - 1) * CHUNK;
      data = all.slice(start, start + CHUNK);
      if (data.length) title = `Câu ${start + 1}-${start + data.length}`;
    } catch (e) {
      data = [];
    }
  } else {
    document.getElementById('empty-msg').textContent =
      'Chưa kết nối Google Sheet. Vào trang Cài đặt để kết nối trước khi luyện tập.';
  }

  document.title = title + ' - Trắc nghiệm';
  window.QuizEngine.init(data, title);
})();
</script>
</body>
</html>
